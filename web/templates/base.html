<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AV Signage Player{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v=6">
  <!-- Aplica tema ANTES do render para evitar flash -->
  <script>
    (function () {
      var t = localStorage.getItem('av-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  {% block nav %}
  <nav>
    <span class="nav-brand">AV Signage Player</span>
    <div class="nav-links">
      <a href="/dashboard">Dashboard</a>
      <a href="/media">Mídias</a>
      <a href="/playlists">Playlists</a>
      <a href="/schedule">Agenda</a>
      <a href="/network">Rede</a>
      <a href="/settings">Sistema</a>
      <form action="/logout" method="post" style="display:inline">
        <button type="submit" class="btn-link" style="padding:5px 11px;border-radius:6px;color:rgba(221,226,240,.70);font-size:14px;font-weight:500;transition:background .15s,color .15s">Sair</button>
      </form>
      <!-- Toggle Tema: ícones SVG inline p/ consistência entre fontes -->
      <button id="btn-theme-toggle" type="button" title="Alternar tema claro/escuro">
        <!-- Ícone sol (dark→light) -->
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <!-- Ícone lua (light→dark) -->
        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             style="display:none">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <!-- Indicador de conexão -->
      <span id="conn-dot" title="Verificando conexão…"
            style="display:inline-block;width:8px;height:8px;border-radius:50%;
                   background:#6b7280;margin-left:6px;vertical-align:middle;
                   transition:background .4s"></span>
    </div>
  </nav>
  {% endblock %}

  <main>
    {% block content %}{% endblock %}
  </main>

  <script src="/static/app.js?v=4"></script>
  <script>
  /* ── Marca link de nav ativo ── */
  (function () {
    var path = window.location.pathname.replace(/\/$/, '') || '/';
    document.querySelectorAll('.nav-links a').forEach(function (a) {
      var href = a.getAttribute('href').replace(/\/$/, '') || '/';
      if (path === href || (href !== '/' && path.startsWith(href))) {
        a.classList.add('nav-active');
      }
    });
  })();

  /* ── Tema Light / Dark ── */
  (function () {
    function setThemeIcons(t) {
      var sun  = document.getElementById('icon-sun');
      var moon = document.getElementById('icon-moon');
      if (!sun || !moon) return;
      if (t === 'light') {
        sun.style.display  = 'none';
        moon.style.display = '';
      } else {
        sun.style.display  = '';
        moon.style.display = 'none';
      }
    }

    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      try { localStorage.setItem('av-theme', t); } catch(e) {}
      setThemeIcons(t);
    }

    /* Sincroniza ícone com o tema já aplicado no <head> */
    var current = document.documentElement.getAttribute('data-theme') || 'dark';
    setThemeIcons(current);

    /* Vincula clique */
    var btn = document.getElementById('btn-theme-toggle');
    if (btn) {
      btn.addEventListener('click', function () {
        var next = (document.documentElement.getAttribute('data-theme') || 'dark') === 'dark' ? 'light' : 'dark';
        applyTheme(next);
      });
    }

    window.toggleTheme = function () {
      var next = (document.documentElement.getAttribute('data-theme') || 'dark') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
    };
  })();

  /* ── Ping de conexão ── */
  (function () {
    var dot = document.getElementById('conn-dot');
    var _last = null;
    function setDot(ok) {
      if (_last === ok) return;
      _last = ok;
      dot.style.background = ok ? '#22c55e' : '#ef4444';
      dot.title = ok ? 'Conectado' : 'Sem conexão — tentando reconectar…';
    }
    async function ping() {
      try { setDot((await fetch('/health', { cache: 'no-store' })).ok); }
      catch (e) { setDot(false); }
    }
    ping();
    setInterval(ping, 10000);
  })();
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
