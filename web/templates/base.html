<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AV Signage Player{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% block nav %}
  <nav>
    <span class="nav-brand">AV Signage Player</span>
    <div class="nav-links">
      <a href="/dashboard">Dashboard</a>
      <a href="/media">Mídias</a>
      <a href="/playlists">Playlists</a>
      <a href="/schedule">Agenda</a>
      <a href="/network">Rede</a>
      <a href="/settings">Sistema</a>
      <form action="/logout" method="post" style="display:inline">
        <button type="submit" class="btn-link">Sair</button>
      </form>
      <span id="conn-dot" title="Verificando conexão…"
            style="display:inline-block;width:9px;height:9px;border-radius:50%;
                   background:#6b7280;margin-left:14px;vertical-align:middle;
                   transition:background .4s"></span>
    </div>
  </nav>
  {% endblock %}

  <main>
    {% block content %}{% endblock %}
  </main>

  <script src="/static/app.js"></script>
  <script>
  (function () {
    const dot = document.getElementById('conn-dot');
    let _last = null;

    function setDot(ok) {
      if (_last === ok) return;
      _last = ok;
      dot.style.background = ok ? '#22c55e' : '#ef4444';
      dot.title = ok ? 'Conectado' : 'Sem conexão — tentando reconectar…';
    }

    async function ping() {
      try {
        const r = await fetch('/health', { cache: 'no-store' });
        setDot(r.ok);
      } catch (e) {
        setDot(false);
      }
    }

    ping();
    setInterval(ping, 10000);
  })();
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
