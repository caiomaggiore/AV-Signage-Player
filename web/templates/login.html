<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AV Signage Player</title>
  <link rel="stylesheet" href="/static/style.css?v=8">
  <!-- Aplica tema salvo ANTES do render para evitar flash -->
  <script>
    (function () {
      var t = localStorage.getItem('av-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body class="login-page">

  <!-- Toggle de tema: canto superior direito -->
  <button id="login-theme-btn" type="button"
      title="Alternar tema claro/escuro"
      style="position:fixed;top:14px;right:14px;
             width:32px;height:32px;padding:0;
             display:flex;align-items:center;justify-content:center;
             border-radius:6px;border:1px solid rgba(255,255,255,.18);
             background:rgba(255,255,255,.08);cursor:pointer;
             color:rgba(221,226,240,.80);transition:background .15s;">
    <svg id="l-icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
    <svg id="l-icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
         style="display:none">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">AV</div>
      <h1>AV Signage Player</h1>
      {% if first_access %}
        <p class="login-subtitle">Primeiro acesso — configure sua senha</p>
      {% else %}
        <p class="login-subtitle">Acesso restrito</p>
      {% endif %}
    </div>

    {% if error %}
      <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form action="/login" method="post">
      <div class="form-group">
        <label for="password">
          {% if first_access %}Nova senha{% else %}Senha{% endif %}
        </label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="{% if first_access %}Mínimo 6 caracteres{% else %}Digite sua senha{% endif %}"
          required
          autofocus
        >
      </div>

      {% if first_access %}
      <div class="form-group">
        <label for="password_confirm">Confirmar senha</label>
        <input
          type="password"
          id="password_confirm"
          name="password_confirm"
          placeholder="Repita a senha"
          required
        >
      </div>
      {% endif %}

      <button type="submit" class="btn btn-primary btn-full">
        {% if first_access %}Definir senha e entrar{% else %}Entrar{% endif %}
      </button>
    </form>

    <div class="login-footer">
      <span class="text-muted">{{ hostname if hostname else "signage-maggiore" }}</span>
    </div>
  </div>

  <script>
  (function () {
    var sun  = document.getElementById('l-icon-sun');
    var moon = document.getElementById('l-icon-moon');
    var btn  = document.getElementById('login-theme-btn');

    function applyIcons(t) {
      sun.style.display  = t === 'light' ? 'none' : 'block';
      moon.style.display = t === 'light' ? 'block' : 'none';
      /* botão: fundo semi-transparente diferente por tema */
      btn.style.background = t === 'light'
        ? 'rgba(0,0,0,.10)'
        : 'rgba(255,255,255,.08)';
      btn.style.borderColor = t === 'light'
        ? 'rgba(0,0,0,.18)'
        : 'rgba(255,255,255,.18)';
      btn.style.color = t === 'light' ? 'rgba(30,30,50,.80)' : 'rgba(221,226,240,.80)';
    }

    var current = document.documentElement.getAttribute('data-theme') || 'dark';
    applyIcons(current);

    btn.addEventListener('click', function () {
      var next = (document.documentElement.getAttribute('data-theme') || 'dark') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('av-theme', next); } catch(e) {}
      applyIcons(next);
    });
  })();
  </script>
</body>
</html>
